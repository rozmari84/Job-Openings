name: 채용정보 크롤링

on:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 기준 23시, 전날)
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼도 사용 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 크롤러 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 변경된 state.json 커밋
        run: |
          git config user.name "job-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "chore: update job posting state"
          git push
